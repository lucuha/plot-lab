<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散布図行列ツール</title>
<style>
  :root{
    --bg:#0f1210;
    --panel:#171b18;
    --panel-2:#1d221e;
    --grid:#2a322c;
    --grid-strong:#3a453d;
    --ink:#dce4da;
    --ink-dim:#8a9690;
    --accent:#7fe0a0;
    --accent-2:#e8a33d;
    --danger:#e8666a;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  header{padding:22px 28px 14px; border-bottom:1px solid var(--grid);}
  header .kicker{color:var(--accent); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin:0 0 6px;}
  header h1{margin:0; font-size:22px; font-weight:600; letter-spacing:0.01em;}
  header p{margin:8px 0 0; color:var(--ink-dim); font-size:12.5px; max-width:70ch;}
  header nav{margin-top:10px; display:flex; gap:14px;}
  header nav a{color:var(--ink-dim); font-size:11.5px; text-decoration:none; border-bottom:1px solid transparent;}
  header nav a:hover{color:var(--accent); border-color:var(--accent);}
  main.layout{
    display:grid;
    grid-template-columns: 360px 1fr;
    gap:1px;
    background:var(--grid);
    min-height:calc(100vh - 118px);
  }
  @media (max-width: 860px){ main.layout{grid-template-columns: 1fr;} }
  .panel{background:var(--panel); padding:20px 22px;}
  .panel h2{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-dim); margin:0 0 12px; display:flex; align-items:center; gap:8px;
  }
  .panel h2::before{content:""; width:6px; height:6px; background:var(--accent); display:inline-block;}
  textarea{
    width:100%; min-height:150px; resize:vertical;
    background:var(--panel-2); border:1px solid var(--grid-strong); color:var(--ink);
    font-family:var(--mono); font-size:12.5px; padding:10px 12px; outline:none;
  }
  textarea:focus{border-color:var(--accent);}
  .hint{color:var(--ink-dim); font-size:11px; margin:6px 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--ink-dim); letter-spacing:0.06em; margin-bottom:5px;}
  .field .val{color:var(--accent); font-variant-numeric:tabular-nums;}
  .row{display:flex; gap:10px;}
  .row > .field{flex:1;}
  input[type="number"]{
    width:100%; background:var(--panel-2); border:1px solid var(--grid-strong); color:var(--ink);
    font-family:var(--mono); font-size:13px; padding:8px 9px; outline:none;
  }
  input[type="number"]:focus{border-color:var(--accent);}
  input[type="range"]{width:100%; accent-color:var(--accent);}
  .warning{
    margin-top:4px; margin-bottom:14px; padding:9px 11px; border:1px solid var(--danger);
    color:var(--danger); font-size:11.5px; display:none;
  }
  .warning.show{display:block;}
  .varlist{
    display:flex; flex-direction:column; gap:6px;
    max-height:220px; overflow-y:auto;
    background:var(--panel-2); border:1px solid var(--grid); padding:10px;
  }
  .varlist label{
    display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; user-select:none;
  }
  .varlist input{accent-color:var(--accent);}
  .swatch{width:9px; height:9px; background:var(--accent); display:inline-block; flex:none;}
  .readout{margin-top:20px; border-top:1px solid var(--grid); padding-top:16px;}
  .readout-grid{display:grid; grid-template-columns: 1fr 1fr; gap:10px 14px;}
  .stat{background:var(--panel-2); border:1px solid var(--grid); padding:8px 10px;}
  .stat .k{font-size:10px; color:var(--ink-dim); letter-spacing:0.1em; text-transform:uppercase;}
  .stat .v{font-size:15px; color:var(--accent); margin-top:2px; font-variant-numeric:tabular-nums;}
  .chart-panel{display:flex; flex-direction:column; min-height:100%;}
  .chart-panel .chart-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .chart-wrap{
    flex:1; background:var(--panel-2); border:1px solid var(--grid);
    min-height:420px; overflow:auto; position:relative;
  }
  svg{display:block;}
  .cell-border{fill:var(--panel-2); stroke:var(--grid-strong); stroke-width:1;}
  .point{fill:var(--accent);}
  .bar{fill:var(--accent-2);}
  .diag-title{fill:var(--ink); font-family:var(--mono); font-size:12px; font-weight:600;}
  .tick-text{fill:var(--ink-dim); font-family:var(--mono); font-size:9.5px;}
  .empty-state{
    display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--ink-dim); font-size:12.5px; text-align:center; padding:20px;
  }
  footer{padding:14px 28px; color:var(--ink-dim); font-size:11px; border-top:1px solid var(--grid);}
</style>
</head>
<body>

<header>
  <p class="kicker">Instrument / Pairwise Relationships</p>
  <h1>散布図行列ツール</h1>
  <p>複数列の数値データを貼り付けると、全変数の組み合わせを総当たりで並べた散布図行列（対角はヒストグラム）を描画します。</p>
  <nav><a href="index.html">← ツール一覧</a> <a href="histogram.html">ヒストグラム</a> <a href="violin.html">バイオリンチャート</a></nav>
</header>

<main class="layout">

  <section class="panel input-panel">
    <h2>データ入力</h2>
    <textarea id="dataInput" placeholder="1行目に列名（任意）&#10;x, y, z&#10;1, 2, 3&#10;4, 5, 6">x, y, z
1.2, 3.4, 5.1
2.1, 2.9, 4.7
3.5, 5.0, 6.2
0.8, 1.9, 3.9
4.2, 6.1, 7.0
1.9, 3.0, 4.5
3.1, 4.4, 5.8
2.6, 3.8, 5.0
0.5, 1.2, 3.2
3.8, 5.6, 6.8
2.2, 3.3, 4.9
1.5, 2.6, 4.1
4.6, 6.5, 7.4
0.9, 1.6, 3.4
3.3, 4.9, 6.0</textarea>
    <p class="hint">列はカンマ・タブ・スペース区切り。エクセルから複数列をコピーして貼り付け可。1行目が数値でない場合は列名（ヘッダー）として扱います。</p>

    <h2>使用する変数</h2>
    <div class="varlist" id="varList"></div>

    <div class="warning" id="warningBox"></div>

    <div class="readout">
      <h2>表示設定</h2>
      <div class="field">
        <label for="binCount">対角ヒストグラムのビン数: <span class="val" id="binCountVal">10</span></label>
        <input type="range" id="binCount" min="3" max="30" step="1" value="10">
      </div>
      <div class="field">
        <label for="pointSize">点のサイズ: <span class="val" id="pointSizeVal">2.5</span></label>
        <input type="range" id="pointSize" min="1" max="6" step="0.5" value="2.5">
      </div>
      <div class="field">
        <label for="pointOpacity">点の不透明度: <span class="val" id="pointOpacityVal">0.7</span></label>
        <input type="range" id="pointOpacity" min="0.1" max="1" step="0.05" value="0.7">
      </div>
    </div>

    <div class="readout" id="statsSection" style="display:none;">
      <h2>データサマリー</h2>
      <div class="readout-grid" id="statsGrid"></div>
    </div>
  </section>

  <section class="panel chart-panel">
    <div class="chart-head"><h2 style="margin:0;">散布図行列</h2></div>
    <div class="chart-wrap" id="chartWrap">
      <div class="empty-state" id="emptyState">データを入力してください（自動で描画されます）</div>
      <svg id="chart" style="display:none;"></svg>
    </div>
  </section>

</main>

<footer>すべての処理はブラウザ内で完結します。入力データは外部に送信されません。</footer>

<script>
(function(){
  "use strict";

  const dataInput    = document.getElementById('dataInput');
  const varList      = document.getElementById('varList');
  const warningBox   = document.getElementById('warningBox');
  const binCountEl   = document.getElementById('binCount');
  const binCountVal  = document.getElementById('binCountVal');
  const pointSizeEl  = document.getElementById('pointSize');
  const pointSizeVal = document.getElementById('pointSizeVal');
  const pointOpEl    = document.getElementById('pointOpacity');
  const pointOpVal   = document.getElementById('pointOpacityVal');
  const emptyState   = document.getElementById('emptyState');
  const svg          = document.getElementById('chart');
  const chartWrap    = document.getElementById('chartWrap');
  const statsSection = document.getElementById('statsSection');
  const statsGrid    = document.getElementById('statsGrid');

  let selectedVars = null; // remembers checkbox state across re-parses when column set is unchanged

  function showWarning(msg){
    if(!msg){ warningBox.classList.remove('show'); warningBox.textContent=''; return; }
    warningBox.textContent = msg;
    warningBox.classList.add('show');
  }

  function fmt(num){
    if(!Number.isFinite(num)) return '—';
    const abs = Math.abs(num);
    if(abs !== 0 && (abs < 0.001 || abs >= 100000)) return num.toExponential(2);
    return (Math.round(num * 1000) / 1000).toString();
  }

  function mean(arr){ return arr.reduce((a,b)=>a+b,0) / arr.length; }

  function parseTable(text){
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    if(lines.length === 0) return { names: [], columns: [], skipped: 0, rowCount: 0 };

    const splitLine = l => l.split(/[,\t]+|\s+/).map(s=>s.trim()).filter(s=>s.length>0);

    const firstTokens = splitLine(lines[0]);
    const firstIsHeader = firstTokens.some(t => !Number.isFinite(Number(t)));

    let names, dataLines;
    if(firstIsHeader){
      names = firstTokens;
      dataLines = lines.slice(1);
    } else {
      names = firstTokens.map((_, i) => 'var' + (i+1));
      dataLines = lines;
    }

    const colCount = names.length;
    const columns = Array.from({length: colCount}, () => []);
    let skipped = 0;

    dataLines.forEach(line => {
      const tokens = splitLine(line);
      if(tokens.length !== colCount){ skipped++; return; }
      const nums = tokens.map(Number);
      if(nums.some(n => !Number.isFinite(n))){ skipped++; return; }
      nums.forEach((n, i) => columns[i].push(n));
    });

    return { names, columns, skipped, rowCount: dataLines.length };
  }

  function renderVarList(names){
    const namesKey = names.join('|');
    if(!selectedVars || selectedVars.__key !== namesKey){
      selectedVars = { __key: namesKey };
      names.forEach(n => { selectedVars[n] = true; });
    }
    varList.innerHTML = names.map(n =>
      `<label><input type="checkbox" data-var="${n}" ${selectedVars[n] ? 'checked' : ''}><span class="swatch"></span>${n}</label>`
    ).join('');
    varList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        selectedVars[cb.dataset.var] = cb.checked;
        run();
      });
    });
  }

  function niceTicks3(min, max){
    if(min === max) return [min];
    return [min, (min+max)/2, max];
  }

  function buildHistogram(values, domain, binCount){
    const [lo, hi] = domain;
    let width = (hi - lo) / binCount;
    if(width === 0) width = 1;
    const counts = new Array(binCount).fill(0);
    values.forEach(v => {
      let idx = Math.floor((v - lo) / width);
      idx = Math.min(Math.max(idx, 0), binCount - 1);
      counts[idx]++;
    });
    return counts;
  }

  function el(tag, attrs){
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function renderStats(names, columns, skipped, rowCount){
    statsSection.style.display = 'block';
    const items = [
      ['変数数', names.length],
      ['有効行数', columns[0] ? columns[0].length : 0],
      ['読込行数', rowCount],
      ['スキップ行数', skipped],
    ];
    statsGrid.innerHTML = items.map(([k,v]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`
    ).join('');
  }

  function renderMatrix(names, columns, opts){
    const n = names.length;
    emptyState.style.display = 'none';
    svg.style.display = 'block';
    svg.innerHTML = '';

    const domains = columns.map(col => {
      const lo = Math.min(...col), hi = Math.max(...col);
      const pad = (hi - lo) * 0.06 || 1;
      return [lo - pad, hi + pad];
    });

    const availW = Math.max(chartWrap.clientWidth - 40, 300);
    const cellSize = Math.max(90, Math.min(190, Math.floor((availW - 60) / n)));
    const gap = 2;
    const margin = { top: 14, right: 18, bottom: 34, left: 54 };
    const plotSize = n * cellSize + (n-1) * gap;
    const W = margin.left + plotSize + margin.right;
    const H = margin.top + plotSize + margin.bottom;

    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const r = parseFloat(opts.pointSize);
    const opacity = parseFloat(opts.pointOpacity);

    for(let i=0;i<n;i++){
      for(let j=0;j<n;j++){
        const cx = margin.left + j * (cellSize + gap);
        const cy = margin.top + i * (cellSize + gap);
        const g = el('g', { transform: `translate(${cx},${cy})` });
        svg.appendChild(g);
        g.appendChild(el('rect', { class:'cell-border', x:0, y:0, width:cellSize, height:cellSize }));

        if(i === j){
          // diagonal: histogram
          const counts = buildHistogram(columns[i], domains[i], opts.binCount);
          const maxC = Math.max(1, ...counts);
          const barW = cellSize / opts.binCount;
          const titleH = 16;
          const plotH = cellSize - titleH - 4;
          counts.forEach((c, k) => {
            const h = (c / maxC) * plotH;
            g.appendChild(el('rect', {
              class:'bar',
              x: k*barW + 0.5,
              y: cellSize - h,
              width: Math.max(0.5, barW - 1),
              height: h
            }));
          });
          const title = el('text', { class:'diag-title', x: cellSize/2, y: titleH - 3, 'text-anchor':'middle' });
          title.textContent = names[i].length > 16 ? names[i].slice(0,15)+'…' : names[i];
          g.appendChild(title);
        } else {
          // off-diagonal: scatter, x = column j, y = row i
          const [xlo, xhi] = domains[j];
          const [ylo, yhi] = domains[i];
          const xs = columns[j], ys = columns[i];
          for(let k=0;k<xs.length;k++){
            const px = ((xs[k]-xlo)/(xhi-xlo||1)) * cellSize;
            const py = cellSize - ((ys[k]-ylo)/(yhi-ylo||1)) * cellSize;
            g.appendChild(el('circle', { class:'point', cx:px, cy:py, r:r, opacity:opacity }));
          }
        }

        // outer bottom row: x ticks
        if(i === n-1){
          niceTicks3(domains[j][0], domains[j][1]).forEach((t, idx) => {
            const x = ((t - domains[j][0]) / ((domains[j][1]-domains[j][0])||1)) * cellSize;
            const anchor = idx === 0 ? 'start' : (idx === 2 ? 'end' : 'middle');
            const label = el('text', { class:'tick-text', x:x, y:cellSize+13, 'text-anchor':anchor });
            label.textContent = fmt(t);
            g.appendChild(label);
          });
        }
        // outer left column: y ticks (skip diagonal, semantics differ)
        if(j === 0 && i !== 0){
          niceTicks3(domains[i][0], domains[i][1]).forEach((t, idx) => {
            const y = cellSize - ((t - domains[i][0]) / ((domains[i][1]-domains[i][0])||1)) * cellSize;
            const label = el('text', { class:'tick-text', x:-6, y:y+3, 'text-anchor':'end' });
            label.textContent = fmt(t);
            g.appendChild(label);
          });
        }
      }
    }
  }

  function run(){
    binCountVal.textContent = binCountEl.value;
    pointSizeVal.textContent = pointSizeEl.value;
    pointOpVal.textContent = pointOpEl.value;

    const parsed = parseTable(dataInput.value);
    showWarning('');

    if(parsed.names.length === 0 || parsed.columns.every(c => c.length === 0)){
      showWarning('数値データが見つかりません。入力形式を確認してください。');
      emptyState.style.display = 'flex';
      svg.style.display = 'none';
      statsSection.style.display = 'none';
      varList.innerHTML = '';
      return;
    }

    renderVarList(parsed.names);

    const activeIdx = parsed.names
      .map((n, i) => selectedVars[n] ? i : -1)
      .filter(i => i >= 0);

    if(activeIdx.length < 2){
      showWarning('散布図行列の作成には2つ以上の変数（列）が必要です。');
      emptyState.style.display = 'flex';
      svg.style.display = 'none';
      statsSection.style.display = 'none';
      return;
    }

    const rowLen = Math.min(...activeIdx.map(i => parsed.columns[i].length));
    if(rowLen < 2){
      showWarning('有効なデータ行が不足しています。');
      return;
    }

    let msgs = [];
    if(parsed.skipped > 0) msgs.push(`${parsed.skipped}行を読み込めずスキップしました（列数不一致または非数値）。`);
    if(activeIdx.length > 8) msgs.push('変数が多いため描画が大きくなります。横スクロールでご覧ください。');
    showWarning(msgs.join(' '));

    const names = activeIdx.map(i => parsed.names[i]);
    const columns = activeIdx.map(i => parsed.columns[i].slice(0, rowLen));

    renderMatrix(names, columns, {
      binCount: parseInt(binCountEl.value, 10),
      pointSize: pointSizeEl.value,
      pointOpacity: pointOpEl.value
    });

    renderStats(parsed.names, columns, parsed.skipped, parsed.rowCount);
  }

  function debounce(fn, delay){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }
  const debouncedRun = debounce(run, 250);

  dataInput.addEventListener('input', debouncedRun);
  binCountEl.addEventListener('input', run);
  pointSizeEl.addEventListener('input', run);
  pointOpEl.addEventListener('input', run);
  window.addEventListener('resize', debounce(run, 200));

  run();
})();
</script>
</body>
</html>
